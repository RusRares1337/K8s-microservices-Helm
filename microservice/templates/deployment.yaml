apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.appName }}
spec:
  replicas: {{ .Values.appReplicas }}
  selector:
    matchLabels:
      app: {{ .Values.appName }}
  template:
    metadata:
      labels:
        app: {{ .Values.appName }}
    spec:
      containers:
      - name: {{ .Values.appName }}
        image: "{{ .Values.appImage}}:{{ .Values.appVersion }}" # trebuie sa fie intre ghilimele ca sa fie interpretat ca si un string si ":"
        ports:
        - containerPort: {{ .Values.containerPort }}